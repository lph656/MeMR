base_model: chinese-alpaca-plus-7b-hf
tokenizer: chinese-alpaca-plus-7b-hf
dataset_name: CMedCL
dataset_root: datasets/medical_consult
prompt_template: "你是一位专业的AI医生，请根据患者的提问给出建议。\\n\\n患者提问：{instruction}\\n\\nAI医生回答："
meta_embeddings_path: metadata_embeddings/keshi_meta_embeddings.pt

lora:
  r: 4
  alpha: 16
  dropout: 0.1
  target_modules:
    - q_proj
    - v_proj

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  epochs: 4
  optimizer: AdamW
  max_seq_length: 512
  max_target_length: 64
  validation_split_percentage: 0.1
  seed: 42

decoding:
  strategy: greedy
  max_new_tokens: 64
  temperature: TODO
  top_p: TODO
  num_beams: TODO

continual_learning:
  task_orders:
    order1: [IM, S, P, GO, A, O]
    order2: [O, P, S, A, IM, GO]
    order3: [A, P, S, GO, IM, O]

replay:
  replay_per_task: 200

output_root: reviewer_fairness/results
